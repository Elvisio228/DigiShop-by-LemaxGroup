name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Production Assets
        run: npm run build

      - name: Deploy to Firebase Hosting (Action officielle Google/Firebase)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIGISHOP_BY_LEMAXGROUP != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIGISHOP_BY_LEMAXGROUP }}'
          channelId: live
          projectId: digishop-by-lemaxgroup

      - name: Deploy to Firebase Hosting (Fallback CLI avec Token)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIGISHOP_BY_LEMAXGROUP == '' && secrets.FIREBASE_TOKEN != '' }}
        run: |
          npx -y firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project digishop-by-lemaxgroup --non-interactive

      - name: Validation finale
        run: echo "✅ Pipeline GitHub Actions DigiShop exécuté avec succès !"
