name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Production Assets
        run: npm run build

      - name: Deploy to Firebase Hosting
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIGISHOP_BY_LEMAXGROUP != '' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        continue-on-error: true
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIGISHOP_BY_LEMAXGROUP }}'
          channelId: live
          projectId: digishop-by-lemaxgroup

      - name: Validation du Build
        run: echo "Build Digishop validé et compilé avec succès pour GitHub !"
