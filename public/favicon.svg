<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(6, 6)" filter="url(#shadow)">
    <rect width="48" height="48" rx="14" fill="url(#logoGrad)" />
    <!-- Modern Isometric / Diamond Symbol -->
    <path d="M24 13L35 19.5V32.5L24 39L13 32.5V19.5L24 13Z" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" fill="none" opacity="0.9" />
    <path d="M24 13V26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M35 19.5L24 26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <path d="M13 19.5L24 26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Central pulse dot -->
    <circle cx="24" cy="26" r="3" fill="#38bdf8" />
  </g>

  <!-- Brand Typography -->
  <text x="66" y="32" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5" fill="#0f172a">
    Digi<tspan fill="#0284c7">shop</tspan>
  </text>
  <text x="67" y="46" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9.5" letter-spacing="1.5" fill="#64748b">
    BY LEMAX GROUP
  </text>
</svg>
